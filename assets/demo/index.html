<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>週末の3タスク</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #F5F0E6;
      --green: #2F4F3A;
      --orange: #C9773B;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      background: var(--paper);
      color: var(--green);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
      line-height: 1.7;
    }

    main { width: 100%; max-width: 640px; min-width: 0; }

    header { margin-bottom: 32px; }
    .eyebrow { margin: 0 0 8px; font-size: 0.875rem; letter-spacing: 0.12em; }
    h1 { margin: 0 0 12px; font-size: clamp(1.9rem, 7vw, 2.75rem); line-height: 1.35; letter-spacing: 0.03em; }
    .intro { margin: 0; }

    .tasks { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
    .task {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
      padding: 22px;
      border: 1px solid var(--green);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.3);
      cursor: pointer;
    }

    .task input {
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      margin: 0;
      accent-color: var(--orange);
      cursor: pointer;
    }

    .task-copy { min-width: 0; overflow-wrap: anywhere; }
    .task-title { display: block; font-size: 1.2rem; font-weight: 700; }
    .task-description { display: block; margin-top: 4px; font-size: 0.95rem; }
    .task.is-complete { border-color: var(--orange); background: rgba(201, 119, 59, 0.09); }
    .task.is-complete .task-title { text-decoration: line-through; text-decoration-color: var(--orange); text-decoration-thickness: 2px; }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--green);
    }

    #counter { margin: 0; font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    button {
      max-width: 100%;
      min-height: 48px;
      padding: 10px 24px;
      border: 1px solid var(--green);
      border-radius: 999px;
      background: var(--green);
      color: var(--paper);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { box-shadow: 0 0 0 2px var(--orange); }
    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--green); outline-offset: 5px; }

    @media (max-width: 390px) {
      body { padding: 32px 16px; }
      .task { padding: 20px 16px; gap: 14px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <header>
      <p class="eyebrow">自分のペースで過ごす週末</p>
      <h1 id="page-title">週末の3タスク</h1>
      <p class="intro">できたことから、ひとつずつチェック。</p>
    </header>

    <ul class="tasks" aria-label="週末のタスク">
      <li>
        <label class="task">
          <input type="checkbox" name="task" value="shopping">
          <span class="task-copy">
            <span class="task-title">買い物</span>
            <span class="task-description">旬の果物をひとつ選ぶ。</span>
          </span>
        </label>
      </li>
      <li>
        <label class="task">
          <input type="checkbox" name="task" value="reading">
          <span class="task-copy">
            <span class="task-title">読書</span>
            <span class="task-description">窓辺で物語をひと章読む。</span>
          </span>
        </label>
      </li>
      <li>
        <label class="task">
          <input type="checkbox" name="task" value="walking">
          <span class="task-copy">
            <span class="task-title">散歩</span>
            <span class="task-description">近くの公園で季節を探す。</span>
          </span>
        </label>
      </li>
    </ul>

    <footer>
      <p id="counter" role="status" aria-live="polite" aria-atomic="true">完了 0 / 3</p>
      <button id="reset" type="button">全解除</button>
    </footer>
  </main>

  <script>
    const checkboxes = Array.from(document.querySelectorAll('input[name="task"]'));
    const counter = document.getElementById('counter');
    const resetButton = document.getElementById('reset');

    function updateTasks() {
      let completed = 0;
      checkboxes.forEach((checkbox) => {
        if (checkbox.checked) completed += 1;
        checkbox.closest('label').classList.toggle('is-complete', checkbox.checked);
      });
      counter.textContent = `完了 ${completed} / ${checkboxes.length}`;
    }

    checkboxes.forEach((checkbox) => checkbox.addEventListener('change', updateTasks));
    resetButton.addEventListener('click', () => {
      checkboxes.forEach((checkbox) => { checkbox.checked = false; });
      updateTasks();
    });
    updateTasks();
  </script>
</body>
</html>
